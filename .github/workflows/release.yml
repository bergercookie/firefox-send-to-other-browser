name: Release

# Runs for every new version tag (v1.2.3) that points at a commit on main/master.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to be on main/master
        run: |
          for branch in main master; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" 2>/dev/null; then exit 0; fi
          done
          echo "::error::tag $GITHUB_REF_NAME is not on main/master"
          exit 1
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: browser-actions/setup-firefox@v1
      - run: just check-version "$GITHUB_REF_NAME"
      - run: just ci
      - run: just package
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
